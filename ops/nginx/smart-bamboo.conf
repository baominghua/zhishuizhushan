limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/m;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json application/geo+json application/xml image/svg+xml application/vnd.mapbox-vector-tile;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 2g;
    proxy_connect_timeout 60s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    limit_req_status 429;

    location = /api/auth/login {
        client_max_body_size 16k;
        limit_req zone=login_per_ip burst=5 nodelay;
        proxy_pass http://app:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 81;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    client_max_body_size 2g;
    proxy_connect_timeout 60s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    limit_req_status 429;

    location = / {
        return 302 /v2/workspace;
    }

    location = /admin-login.html {
        if ($arg_returnTo = "") {
            return 302 /admin-login.html?returnTo=/v2/workspace;
        }
        proxy_pass http://app:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        client_max_body_size 16k;
        limit_req zone=login_per_ip burst=5 nodelay;
        proxy_pass http://app:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://app:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v2/ {
        proxy_pass http://app:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin.css {
        proxy_pass http://app:8010;
    }

    location = /admin-login.js {
        proxy_pass http://app:8010;
    }

    location / {
        return 404;
    }
}

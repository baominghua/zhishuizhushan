services:
  app-v2-secure:
    extends:
      file: compose.primary.yml
      service: app
    environment:
      SMART_BAMBOO_HUMAN_AUTH_ENABLED: "1"
      SMART_BAMBOO_AUTH_REQUIRE_HTTPS: "1"
      SMART_BAMBOO_TRUST_PROXY_HEADERS: "1"
      SMART_BAMBOO_SESSION_COOKIE_SECURE: "1"
    ports: !reset []

  nginx-v2-secure:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    depends_on:
      app-v2-secure:
        condition: service_healthy
    ports:
      - "0.0.0.0:18443:443"
    volumes:
      - ./ops/nginx/smart-bamboo-v2-secure.conf:/etc/nginx/conf.d/default.conf:ro
      - "${SMART_BAMBOO_TLS_CERT_PATH:?Set SMART_BAMBOO_TLS_CERT_PATH}:/etc/nginx/tls/fullchain.pem:ro"
      - "${SMART_BAMBOO_TLS_KEY_PATH:?Set SMART_BAMBOO_TLS_KEY_PATH}:/etc/nginx/tls/privkey.pem:ro"

name: smart-bamboo-primary

services:
  db-primary:
    image: mysql:8.4.9
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Set MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER:?Set MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
    ports:
      - "192.168.0.32:3306:3306"
    volumes:
      - /srv/smart-bamboo/mysql:/var/lib/mysql
      - ./ops/mysql/primary.cnf:/etc/mysql/conf.d/replication.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-bamboo-app:${SMART_BAMBOO_RELEASE_TAG:?Set SMART_BAMBOO_RELEASE_TAG}
    restart: unless-stopped
    depends_on:
      db-primary:
        condition: service_healthy
    environment:
      SMART_BAMBOO_DEPLOYMENT_MODE: production
      REMOTE_SENSING_PORT: "8010"
      REMOTE_SENSING_SERVE_STATIC: "1"
      REMOTE_SENSING_AUTH_REQUIRED: "1"
      REMOTE_SENSING_API_TOKENS: "${REMOTE_SENSING_API_TOKENS:?Set REMOTE_SENSING_API_TOKENS}"
      REMOTE_SENSING_CORS_ORIGINS: "${REMOTE_SENSING_CORS_ORIGINS:?Set REMOTE_SENSING_CORS_ORIGINS}"
      REMOTE_SENSING_CATALOG_BACKEND: mysql
      REMOTE_SENSING_DATABASE_URL: "${REMOTE_SENSING_DATABASE_URL:?Set REMOTE_SENSING_DATABASE_URL}"
      REMOTE_SENSING_DATA_DIR: /app/data/remote-sensing
      REMOTE_SENSING_IMPORT_DIRS: /app/data/remote-sensing/inbox
      REMOTE_SENSING_TASK_WORKERS: "${REMOTE_SENSING_TASK_WORKERS:-1}"
      REMOTE_SENSING_TILE_CACHE: "1"
      REMOTE_SENSING_TILE_CACHE_MAX_BYTES: "${REMOTE_SENSING_TILE_CACHE_MAX_BYTES:-53687091200}"
      REMOTE_SENSING_TILE_CACHE_MAX_AGE_DAYS: "${REMOTE_SENSING_TILE_CACHE_MAX_AGE_DAYS:-30}"
      REMOTE_SENSING_TILE_WEBP_QUALITY: "${REMOTE_SENSING_TILE_WEBP_QUALITY:-85}"
      REMOTE_SENSING_TILE_BROWSER_MAX_AGE: "${REMOTE_SENSING_TILE_BROWSER_MAX_AGE:-2592000}"
      REMOTE_SENSING_TILE_PREWARM: "${REMOTE_SENSING_TILE_PREWARM:-1}"
      REMOTE_SENSING_TILE_PREWARM_MIN_ZOOM: "${REMOTE_SENSING_TILE_PREWARM_MIN_ZOOM:-14}"
      REMOTE_SENSING_TILE_PREWARM_MAX_ZOOM: "${REMOTE_SENSING_TILE_PREWARM_MAX_ZOOM:-20}"
      REMOTE_SENSING_TILE_PREWARM_MAX_TILES: "${REMOTE_SENSING_TILE_PREWARM_MAX_TILES:-512}"
      REMOTE_SENSING_POINT_CLOUD_CHUNK_SIZE: "${REMOTE_SENSING_POINT_CLOUD_CHUNK_SIZE:-16777216}"
      REMOTE_SENSING_PDAL_EXECUTABLE: "${REMOTE_SENSING_PDAL_EXECUTABLE:-pdal}"
      REMOTE_SENSING_3DTILES_EXECUTABLE: "${REMOTE_SENSING_3DTILES_EXECUTABLE:-py3dtiles}"
      REMOTE_SENSING_GEOSERVER_URL: http://geoserver:8080/geoserver
      REMOTE_SENSING_GEOSERVER_WMS_URL: http://geoserver:8080/geoserver/wms
      REMOTE_SENSING_GEOSERVER_WFS_URL: http://geoserver:8080/geoserver/wfs
      REMOTE_SENSING_TIANDITU_TK: "${REMOTE_SENSING_TIANDITU_TK:-}"
      REMOTE_SENSING_TIANDITU_REFERER: "${REMOTE_SENSING_TIANDITU_REFERER:-http://36.140.138.117}"
      REMOTE_SENSING_BASEMAP_CACHE_MAX_BYTES: "${REMOTE_SENSING_BASEMAP_CACHE_MAX_BYTES:-53687091200}"
      REMOTE_SENSING_BASEMAP_CACHE_MAX_AGE_DAYS: "${REMOTE_SENSING_BASEMAP_CACHE_MAX_AGE_DAYS:-30}"
      REMOTE_SENSING_TIANDITU_PREWARM_BOUNDS: "${REMOTE_SENSING_TIANDITU_PREWARM_BOUNDS:-117.5,26.3,119.4,27.6}"
      REMOTE_SENSING_TIANDITU_PREWARM_LAYERS: "${REMOTE_SENSING_TIANDITU_PREWARM_LAYERS:-img_w,cia_w}"
      REMOTE_SENSING_TIANDITU_PREWARM_MIN_ZOOM: "${REMOTE_SENSING_TIANDITU_PREWARM_MIN_ZOOM:-8}"
      REMOTE_SENSING_TIANDITU_PREWARM_MAX_ZOOM: "${REMOTE_SENSING_TIANDITU_PREWARM_MAX_ZOOM:-13}"
      REMOTE_SENSING_TIANDITU_DETAIL_PREWARM_BOUNDS: "${REMOTE_SENSING_TIANDITU_DETAIL_PREWARM_BOUNDS:-117.675,27.495,117.75,27.59}"
      REMOTE_SENSING_TIANDITU_DETAIL_PREWARM_MIN_ZOOM: "${REMOTE_SENSING_TIANDITU_DETAIL_PREWARM_MIN_ZOOM:-14}"
      REMOTE_SENSING_TIANDITU_DETAIL_PREWARM_MAX_ZOOM: "${REMOTE_SENSING_TIANDITU_DETAIL_PREWARM_MAX_ZOOM:-16}"
      REMOTE_SENSING_TIANDITU_PREWARM_MAX_TILES: "${REMOTE_SENSING_TIANDITU_PREWARM_MAX_TILES:-10000}"
      SMART_BAMBOO_STORAGE_BACKEND: mysql
      SMART_BAMBOO_DATABASE_URL: "${SMART_BAMBOO_DATABASE_URL:?Set SMART_BAMBOO_DATABASE_URL}"
      SMART_BAMBOO_MYSQL_WRITE_BATCH_SIZE: "${SMART_BAMBOO_MYSQL_WRITE_BATCH_SIZE:-1000}"
      SMART_BAMBOO_IDENTITY_LOOKUP_BATCH_SIZE: "${SMART_BAMBOO_IDENTITY_LOOKUP_BATCH_SIZE:-1000}"
      SMART_BAMBOO_HUMAN_AUTH_ENABLED: "${SMART_BAMBOO_HUMAN_AUTH_ENABLED:-0}"
      SMART_BAMBOO_DASHBOARD_TOKEN: "${SMART_BAMBOO_DASHBOARD_TOKEN:?Set SMART_BAMBOO_DASHBOARD_TOKEN}"
      SMART_BAMBOO_AUTH_REQUIRE_HTTPS: "${SMART_BAMBOO_AUTH_REQUIRE_HTTPS:-1}"
      SMART_BAMBOO_TRUST_PROXY_HEADERS: "${SMART_BAMBOO_TRUST_PROXY_HEADERS:-1}"
      SMART_BAMBOO_SESSION_COOKIE_SECURE: "${SMART_BAMBOO_SESSION_COOKIE_SECURE:-1}"
      SMART_BAMBOO_VECTOR_TILE_CACHE_TTL_SECONDS: "300"
      SMART_BAMBOO_VECTOR_TILE_CACHE_MAX_BYTES: "${SMART_BAMBOO_VECTOR_TILE_CACHE_MAX_BYTES:-21474836480}"
      SMART_BAMBOO_VECTOR_TILE_CACHE_MAX_AGE_SECONDS: "86400"
      SMART_BAMBOO_VECTOR_TILE_CACHE_PRUNE_INTERVAL_SECONDS: "60"
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - /srv/smart-bamboo/data:/app/data
      - /srv/smart-bamboo/config/satellite-config.local.js:/app/satellite-config.local.js:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health/live', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s

  geoserver:
    image: docker.osgeo.org/geoserver:2.25.7
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: "${GEOSERVER_ADMIN_USER:?Set GEOSERVER_ADMIN_USER}"
      GEOSERVER_ADMIN_PASSWORD: "${GEOSERVER_ADMIN_PASSWORD:?Set GEOSERVER_ADMIN_PASSWORD}"
      SKIP_DEMO_DATA: "true"
      RUN_UNPRIVILEGED: "true"
      RUN_WITH_USER_UID: "1000"
      RUN_WITH_USER_GID: "1000"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /srv/smart-bamboo/geoserver:/opt/geoserver_data

  nginx:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:18080:80"
    volumes:
      - ./ops/nginx/smart-bamboo.conf:/etc/nginx/conf.d/default.conf:ro

services:
  nginx:
    ports:
      - "0.0.0.0:443:443"
    volumes:
      - ./ops/nginx/smart-bamboo-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - "${SMART_BAMBOO_TLS_CERT_PATH:?Set SMART_BAMBOO_TLS_CERT_PATH in the protected env file}:/etc/nginx/tls/fullchain.pem:ro"
      - "${SMART_BAMBOO_TLS_KEY_PATH:?Set SMART_BAMBOO_TLS_KEY_PATH in the protected env file}:/etc/nginx/tls/privkey.pem:ro"

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智慧竹山大数据</title>
    <link rel="stylesheet" href="assets/ol/ol.css" />
    <link rel="stylesheet" href="zhushan-bigdata.css?v=20260716-interaction5" />
  </head>
  <body>
    <main class="screen">
      <header class="screen-title">
        <span></span>
        <h1>智慧竹山大数据</h1>
        <span></span>
        <button
          class="forest-filter-toggle"
          id="forestFilterToggle"
          type="button"
          aria-controls="forestFilterPanel"
          aria-expanded="false"
          aria-label="展开林班筛选"
        >
          <i aria-hidden="true">⌕</i>
          <b>筛选</b>
          <em id="forestFilterBadge" hidden>0</em>
        </button>
      </header>

      <section
        class="forest-filter-panel forest-filter-popover"
        id="forestFilterPanel"
        hidden
        aria-label="林班分层筛选"
      >
        <div class="filter-head">
          <div>
            <strong>林班分层筛选</strong>
            <p id="forestFilterSummary">正在读取后台林班维度</p>
          </div>
          <button id="resetForestFilters" type="button">清除条件</button>
        </div>
        <label><span>区县</span><select data-forest-filter="countyCode"><option value="">全部</option></select></label>
        <label><span>乡镇</span><select data-forest-filter="townCode"><option value="">全部</option></select></label>
        <label><span>村</span><select data-forest-filter="villageCode"><option value="">全部</option></select></label>
        <label><span>基地类型</span><select data-forest-filter="baseType"><option value="">全部</option></select></label>
        <label><span>经营类型</span><select data-forest-filter="operationType"><option value="">全部</option></select></label>
        <label><span>质量等级</span><select data-forest-filter="qualityGrade"><option value="">全部</option></select></label>
        <label><span>健康状态</span><select data-forest-filter="healthStatus"><option value="">全部</option></select></label>
        <label><span>风险等级</span><select data-forest-filter="riskLevel"><option value="">全部</option></select></label>
      </section>

      <aside class="left-tools">
        <nav class="tool-menu" aria-label="功能菜单">
          <button class="active" data-tool="layers" aria-expanded="true"><i>▣</i>图层管理</button>
          <button data-tool="search"><i>⌕</i>竹山搜索</button>
          <button data-tool="carbon"><i>◈</i>碳汇服务图</button>
          <button data-tool="satelliteTrack"><i>◎</i>卫星轨道图</button>
        </nav>

        <section class="layer-card" id="layerCard">
          <div class="layer-list">
            <label><input type="checkbox" data-layer="bamboo" checked /> 竹林林班</label>
            <label><input type="checkbox" data-layer="quality" checked /> 质量等级</label>
            <label><input type="checkbox" data-layer="soil" checked /> 土壤墒情</label>
            <label><input type="checkbox" data-layer="growth" checked /> 长势监测</label>
            <label><input type="checkbox" data-layer="yield" checked /> 产量预测</label>
            <label><input type="checkbox" data-layer="pest" checked /> 病虫害</label>
            <label><input type="checkbox" data-layer="ownership" checked /> 林权经营权</label>
            <label><input type="checkbox" data-layer="farmer" checked /> 竹农</label>
            <label><input type="checkbox" data-layer="cooperative" checked /> 合作社</label>
            <label><input type="checkbox" data-layer="uav" checked /> 无人机航拍</label>
            <label><input type="checkbox" data-layer="satellite" checked /> 卫星底图</label>
            <label><input type="checkbox" data-layer="remoteSensing" checked /> 遥感SDK影像</label>
            <label><input type="checkbox" data-layer="huangkeng" checked /> 麻沙黄坑边界</label>
            <label><input type="checkbox" data-layer="kangVillage" checked /> 康内部分村</label>
            <label><input type="checkbox" data-layer="ovobj" checked /> 导入点位</label>
            <label><input type="checkbox" data-layer="history" /> 历史影像</label>
          </div>
          <section class="dashboard-workflow-status" aria-label="数据交付闭环">
            <div class="dashboard-published-head">
              <strong>数据交付闭环</strong>
              <span>成果入库 / 影像 / 图层</span>
            </div>
            <div id="dashboardWorkflowStatus" class="dashboard-workflow-list">加载中</div>
          </section>
          <section class="dashboard-published-layers" aria-label="后台发布图层">
            <div class="dashboard-published-head">
              <strong>后台发布图层</strong>
              <span>地图图层发布</span>
            </div>
            <div id="dashboardPublishedLayerControls" class="dashboard-published-list">加载中</div>
          </section>
        </section>
      </aside>

      <section class="legend">
        <strong>图例</strong>
        <span><i class="green"></i>优质竹林</span>
        <span><i class="yellow"></i>中等竹林</span>
        <span><i class="orange"></i>改造提升</span>
        <span><i class="red"></i>病虫害预警</span>
        <span><i class="cyan"></i>乡镇边界</span>
      </section>

      <section class="map-scene" id="mapScene" aria-label="竹山三维地图">
        <div class="webgis-map" id="webgisMap"></div>
        <div id="forestBlocks"></div>
      </section>

      <section class="info-card hidden" id="infoCard">
        <button class="close-card" id="closeCard" aria-label="关闭">×</button>
        <header>
          <h2 id="cardTitle">林班电子信息卡</h2>
          <span id="cardSubtitle">竹山分等定级因子表</span>
        </header>
        <div class="info-grid" id="infoGrid"></div>
        <div class="tabs" id="imageTabs"></div>
        <div class="image-panel" id="imagePanel"></div>
      </section>

      <nav class="bottom-dock" aria-label="业务入口">
        <button class="active" data-business="farmer"><span>♧</span>竹农</button>
        <button data-business="cooperative"><span>▤</span>合作社</button>
        <button data-business="enterprise"><span>◉</span>竹企</button>
        <button data-business="plant"><span>✚</span>植保</button>
        <button data-business="material"><span>▥</span>农资</button>
        <button data-business="policy"><span>§</span>政策法规</button>
        <button data-business="industry"><span>产</span>产业平台</button>
        <button type="button" onclick="window.location.href='admin.html'"><span>管</span>管理台账</button>
      </nav>

      <section class="business-card hidden" id="businessCard">
        <button class="close-card" id="closeBusinessCard" aria-label="关闭">×</button>
        <header>
          <h2 id="businessTitle">业务信息</h2>
          <span id="businessSubtitle">智慧竹山业务数据</span>
          <nav class="business-admin-links" id="businessAdminLinks" aria-label="后台管理入口"></nav>
        </header>
        <div class="business-metrics" id="businessMetrics"></div>
        <div class="business-table-wrap">
          <table>
            <thead id="businessHead"></thead>
            <tbody id="businessRows"></tbody>
          </table>
        </div>
      </section>

      <div class="zoom">
        <button id="zoomIn" type="button" aria-label="放大地图" title="放大地图">+</button>
        <b id="zoomValue">100%</b>
        <button id="zoomOut" type="button" aria-label="缩小地图" title="缩小地图">−</button>
      </div>

      <div class="basemap-switch" aria-label="底图模式">
        <button class="active" data-basemap="img">影像</button>
        <button data-basemap="vec">矢量</button>
        <button data-basemap="ter">地形</button>
      </div>
    </main>

    <script src="assets/ol/ol.js"></script>
  <script src="satellite-config.local.js?v=20260611-dev2"></script>
  <script src="sdk/remote-sensing-sdk.js?v=20260611-dev2"></script>
    <script src="offline-maps/fujian-basemap.geojson.js"></script>
    <script src="assets/huang-keng-bamboo-geojson.js"></script>
    <script src="assets/kang-village-geojson.js"></script>
  <script src="zhushan-bigdata.js?v=20260716-interaction5"></script>
</body>
</html>
